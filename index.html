    <div
      id="boot-screen"
      class="min-h-screen max-w-[480px] mx-auto fixed inset-0 flex items-center justify-center px-6"
      style="background: var(--drivex-black); max-width: 480px; margin: 0 auto; z-index: 9999;"
    >
      <div
        class="glass-card-light rounded-3xl p-6 w-full text-center"
        style="border: 1px solid rgba(6, 182, 212, 0.18);"
      >
        <p
          class="text-xs font-semibold"
          style="color: var(--drivex-neon-cyan); letter-spacing: 0.22em;"
        >
          DRIVEX
        </p>
        <h1 class="text-2xl font-bold mt-3" style="color: var(--drivex-white);">
          Загрузка приложения
        </h1>
        <p
          id="boot-message"
          class="mt-3 text-sm"
          style="color: var(--drivex-silver);"
        >
          Подготавливаем Marketplace, Seller CRM и данные пользователя...
        </p>
      </div>
    </div>

    <div
      id="root"
      class="min-h-screen max-w-[480px] mx-auto relative"
      style="background: var(--drivex-black); max-width: 480px; margin: 0 auto"
    ></div>

    <script>
      (function () {
        var bootScreen = document.getElementById("boot-screen");
        var bootMessage = document.getElementById("boot-message");
        var appReady = false;
        var bootTimeout = window.setTimeout(function () {
          if (bootMessage) {
            bootMessage.textContent =
              "Загрузка занимает больше обычного. Если экран не откроется, обновите страницу.";
          }
        }, 5000);

        function showBootError(message) {
          if (!bootScreen || !bootMessage) return;
          bootScreen.style.display = "flex";
          bootMessage.textContent = message || "Не удалось загрузить DRIVEX.";
          bootMessage.style.color = "var(--drivex-danger)";
        }

        window.__DRIVEX_BOOT__ = {
          markReady: function () {
            appReady = true;
            window.clearTimeout(bootTimeout);
            if (bootScreen) {
              bootScreen.style.display = "none";
            }
          },
          showError: showBootError
        };

        window.addEventListener("error", function (event) {
          if (appReady) return;
          if (event && event.target && event.target !== window) return;
          if (event && event.message) {
            var details = event.filename ? " · " + event.filename.split("/").pop() + ":" + (event.lineno || 0) : "";
            showBootError("Ошибка загрузки: " + event.message + details);
          } else {
            showBootError("Ошибка загрузки приложения.");
          }
        });

        window.addEventListener("unhandledrejection", function (event) {
          if (appReady) return;
          var reason = event && event.reason;
          var message = reason && reason.message ? reason.message : "Необработанная ошибка приложения.";
          showBootError(message);
        });

        // Подстраховка: если приложение успело отрендериться, но markReady не вызвался — спрячем экран после загрузки
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (
              root &&
              root.children.length > 0 &&
              window.__DRIVEX_BOOT__ &&
              typeof window.__DRIVEX_BOOT__.markReady === "function"
            ) {
              window.__DRIVEX_BOOT__.markReady();
            } else if (!appReady) {
              showBootError("Открой DriveX через локальный сервер: http://localhost:8080/");
            }
          }, 1200);
        });
      })();
    </script>

        document.head.appendChild(s2);
      })();
    </script>

    <!-- ═══════════════════════════════════════════════════
         DRIVEX — Цепочка модулей (каждый файл знает свою задачу)
         Порядок: globals → data → utils → ui → screens → app-main

    ═══════════════════════════════════════════════════ -->
